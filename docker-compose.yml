version: '3.8'

services:
  # PostgreSQL Relational Database Service
  postgres:
    image: postgres:16-alpine
    container_name: propulse_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: project_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Node.js Express REST Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propulse_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/project_management_db?schema=public"
      JWT_SECRET: "docker-prod-secret-key-project-management-system"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propulse_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
